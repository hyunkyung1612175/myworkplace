<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 관리 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0B1E3D;--navy2:#152B52;--navy3:#1E3A6A;
  --accent:#2E7CF6;--accent2:#1A5FC8;
  --gold:#C9A84C;--gold2:#A8893A;
  --bg:#F4F6FA;--surface:#FFFFFF;
  --text1:#0B1E3D;--text2:#4A5568;--text3:#8896A8;
  --border:#E2E8F0;--border2:#CBD5E0;
  --success:#1A8754;--warn:#B45309;--danger:#C0392B;
  --sidebar-w:240px;
  font-family:'Noto Sans KR',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text1)}

/* ===== LOGIN ===== */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 60%,#1A3A6A 100%);
  position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 80% 20%,rgba(46,124,246,0.15),transparent),
             radial-gradient(ellipse 40% 60% at 10% 80%,rgba(201,168,76,0.08),transparent);
}
.login-box{
  background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.12);
  border-radius:16px;padding:48px 44px;width:400px;position:relative;z-index:1;
  backdrop-filter:blur(8px);
}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .logo-mark{
  width:56px;height:56px;background:var(--accent);border-radius:14px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
}
.login-logo .logo-mark i{font-size:28px;color:#fff}
.login-logo h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:0.5px}
.login-logo p{font-size:11px;color:rgba(255,255,255,0.4);margin-top:5px;letter-spacing:1.5px;text-transform:uppercase}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:6px;letter-spacing:0.5px}
.login-field input{
  width:100%;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.15);
  border-radius:9px;padding:12px 14px;color:#fff;font-size:14px;font-family:inherit;
  transition:border-color 0.2s;outline:none;
}
.login-field input::placeholder{color:rgba(255,255,255,0.25)}
.login-field input:focus{border-color:var(--accent);background:rgba(255,255,255,0.1)}
.login-err{font-size:12px;color:#FC8181;margin-top:8px;display:none}
.btn-login{
  width:100%;background:var(--accent);border:none;border-radius:9px;
  padding:14px;color:#fff;font-size:15px;font-weight:500;font-family:inherit;
  cursor:pointer;margin-top:8px;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--accent2)}
.login-footer{text-align:center;margin-top:24px;font-size:11px;color:rgba(255,255,255,0.2)}

/* ===== PW MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(11,30,61,0.75);
  display:flex;align-items:center;justify-content:center;z-index:9999;
}
.modal-box{
  background:var(--surface);border-radius:14px;padding:36px;width:380px;
  border:0.5px solid var(--border);box-shadow:0 20px 60px rgba(11,30,61,0.25);
}
.modal-box h3{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--navy)}
.modal-box p{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--text3);margin-bottom:5px}
.modal-field input{
  width:100%;border:0.5px solid var(--border2);border-radius:8px;
  padding:11px 13px;font-size:13px;font-family:inherit;outline:none;color:var(--text1);
  background:var(--bg);transition:border-color 0.2s;
}
.modal-field input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:background 0.2s}
.btn-primary:hover{background:var(--accent2)}
.btn-skip{flex:1;background:transparent;color:var(--text2);border:0.5px solid var(--border2);border-radius:8px;padding:11px;font-size:13px;font-family:inherit;cursor:pointer;transition:background 0.2s}
.btn-skip:hover{background:var(--bg)}
.modal-err{font-size:12px;color:var(--danger);margin-top:8px;display:none}

/* ===== DASHBOARD ===== */
#dashboard{display:none;height:100vh;flex-direction:column}
.dash-layout{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);background:var(--navy);flex-shrink:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-header{padding:20px 20px 16px;border-bottom:0.5px solid rgba(255,255,255,0.07);flex-shrink:0}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.sidebar-logo .mark{
  width:34px;height:34px;background:var(--accent);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-logo .mark i{font-size:17px;color:#fff}
.sidebar-logo span{font-size:14px;font-weight:700;color:#fff;letter-spacing:0.3px;line-height:1.2}
.sidebar-user{padding:14px 20px;border-bottom:0.5px solid rgba(255,255,255,0.07);flex-shrink:0}
.sidebar-user .s-label{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:3px}
.sidebar-user .s-emp{font-size:13px;color:rgba(255,255,255,0.85);font-weight:500}
.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.nav-group{margin-bottom:1px}
.nav-parent{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  cursor:pointer;transition:background 0.15s;color:rgba(255,255,255,0.55);
  font-size:13px;font-weight:500;border-left:2.5px solid transparent;user-select:none;
}
.nav-parent:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.9)}
.nav-parent.active{background:rgba(46,124,246,0.12);color:#fff;border-left-color:var(--accent)}
.nav-parent i.menu-icon{font-size:16px;flex-shrink:0}
.nav-parent .arrow{margin-left:auto;font-size:12px;transition:transform 0.2s;flex-shrink:0}
.nav-parent.open .arrow{transform:rotate(180deg)}
.nav-children{display:none;padding:2px 0}
.nav-children.open{display:block}
.nav-child{
  display:flex;align-items:center;gap:8px;padding:8px 20px 8px 46px;
  cursor:pointer;font-size:12px;color:rgba(255,255,255,0.42);
  transition:background 0.15s,color 0.15s;border-left:2.5px solid transparent;user-select:none;
}
.nav-child:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8)}
.nav-child.active{color:var(--accent);border-left-color:var(--accent);background:rgba(46,124,246,0.08)}
.nav-child::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
.sidebar-bottom{padding:14px 20px;border-top:0.5px solid rgba(255,255,255,0.07);flex-shrink:0}
.btn-logout{
  width:100%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);
  border-radius:8px;padding:9px;color:rgba(255,255,255,0.5);font-size:12px;
  font-family:inherit;cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-logout:hover{background:rgba(192,57,43,0.15);border-color:rgba(192,57,43,0.3);color:#FC8181}

/* MAIN */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  background:var(--surface);border-bottom:0.5px solid var(--border);
  padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px}
.topbar-breadcrumb .parent{color:var(--text3)}
.topbar-breadcrumb .sep{color:var(--border2)}
.topbar-breadcrumb .current{color:var(--text1);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:10px}
.month-select{
  background:var(--bg);border:0.5px solid var(--border2);border-radius:7px;
  padding:6px 10px;font-size:12px;font-family:inherit;color:var(--text1);outline:none;cursor:pointer;
}
.month-badge{
  background:rgba(46,124,246,0.1);color:var(--accent);border-radius:6px;
  padding:4px 10px;font-size:11px;font-weight:500;letter-spacing:0.3px;
  border:0.5px solid rgba(46,124,246,0.2);white-space:nowrap;
}
.content-area{flex:1;padding:28px;overflow-y:auto}
.content-area::-webkit-scrollbar{width:5px}
.content-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* PAGES */
.page{display:none}
.page.active{display:block}
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3)}

/* HOME CARDS */
.welcome-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.wcard{
  background:var(--surface);border:0.5px solid var(--border);border-radius:12px;
  padding:20px;position:relative;overflow:hidden;cursor:pointer;
  transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s;
}
.wcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(46,124,246,0.1)}
.wcard::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;
}
.wcard.c1::after{background:var(--accent)}
.wcard.c2::after{background:#8B5CF6}
.wcard.c3::after{background:var(--gold)}
.wcard.c4::after{background:var(--success)}
.wcard-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;font-size:20px;
}
.wcard.c1 .wcard-icon{background:rgba(46,124,246,0.1);color:var(--accent)}
.wcard.c2 .wcard-icon{background:rgba(139,92,246,0.1);color:#8B5CF6}
.wcard.c3 .wcard-icon{background:rgba(201,168,76,0.1);color:var(--gold)}
.wcard.c4 .wcard-icon{background:rgba(26,135,84,0.1);color:var(--success)}
.wcard-label{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.wcard-name{font-size:16px;font-weight:600;color:var(--navy)}
.wcard-sub{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}

.info-panel{
  background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:22px 24px;
}
.info-panel h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--navy);display:flex;align-items:center;gap:8px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.info-item{padding:14px 16px;background:var(--bg);border-radius:9px;border:0.5px solid var(--border)}
.info-item .i-label{font-size:11px;color:var(--text3);margin-bottom:5px}
.info-item .i-val{font-size:14px;font-weight:600;color:var(--navy)}

/* DATA PANEL */
.data-panel{
  background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:22px 24px;
}
.data-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.data-panel-header h3{font-size:14px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px}
.panel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-upload{
  background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;
  font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;
  display:flex;align-items:center;gap:6px;transition:background 0.2s;
}
.btn-upload:hover{background:var(--accent2)}
.btn-upload input[type=file]{display:none}
.btn-reset{
  background:transparent;color:var(--danger);border:0.5px solid rgba(192,57,43,0.35);
  border-radius:8px;padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all 0.2s;
}
.btn-reset:hover{background:rgba(192,57,43,0.06)}
.data-table-wrap{overflow-x:auto;border-radius:8px;border:0.5px solid var(--border)}
.data-table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
.data-table th{
  background:var(--bg);color:var(--text2);font-weight:500;padding:10px 14px;
  text-align:left;border-bottom:0.5px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
.data-table td{padding:9px 14px;border-bottom:0.5px solid var(--border);color:var(--text1);white-space:nowrap}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(46,124,246,0.03)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state i{font-size:40px;display:block;margin-bottom:10px;opacity:0.25}
.empty-state p{font-size:14px;margin-bottom:6px}
.empty-state small{font-size:12px;color:var(--text3)}
.row-count{font-size:11px;color:var(--text3);margin-top:8px;text-align:right}

/* CONFIRM MODAL */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(11,30,61,0.6);
  display:flex;align-items:center;justify-content:center;z-index:9998;
}
.confirm-box{
  background:var(--surface);border-radius:12px;padding:28px 28px 24px;width:340px;
  border:0.5px solid var(--border);
}
.confirm-box h4{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--navy)}
.confirm-box p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.confirm-actions{display:flex;gap:8px}
.btn-confirm-del{flex:1;background:var(--danger);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
.btn-confirm-del:hover{background:#A93226}
.btn-confirm-cancel{flex:1;background:transparent;color:var(--text2);border:0.5px solid var(--border2);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;cursor:pointer}
.btn-confirm-cancel:hover{background:var(--bg)}

/* ===== 계약이관 ===== */
.tr-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.tr-ucard{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:18px}
.tr-ucard h4{font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tr-ucard p{font-size:11px;color:var(--text3);margin-bottom:12px;line-height:1.5}
.tr-drop{border:1.5px dashed var(--border2);border-radius:8px;padding:14px;text-align:center;
  cursor:pointer;transition:all .2s}
.tr-drop:hover,.tr-drop.drag{border-color:var(--accent);background:rgba(46,124,246,.03)}
.tr-drop i{font-size:20px;color:var(--text3);display:block;margin-bottom:4px}
.tr-drop p{font-size:11.5px;color:var(--text3);margin:0}
.tr-drop small{font-size:10.5px;color:var(--border2)}
.tr-drop input{display:none}
.tr-fpill{display:none;align-items:center;gap:7px;background:rgba(46,124,246,.07);
  border:0.5px solid rgba(46,124,246,.2);border-radius:6px;padding:6px 10px;margin-top:8px}
.tr-fpill.show{display:flex}
.tr-fpill i{font-size:14px;color:var(--accent)}
.tr-fpill span{font-size:11.5px;color:var(--navy);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-fpill button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0}
.tr-run-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.tr-run-btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 28px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s;
  display:flex;align-items:center;gap:7px}
.tr-run-btn:hover{background:var(--accent2)}
.tr-run-btn:disabled{background:var(--border2);cursor:not-allowed}
.tr-run-status{font-size:12px;color:var(--text3)}
.tr-result{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden}
.tr-result-hd{padding:14px 20px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.tr-result-hd h3{font-size:14px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:6px}
.tr-result-tabs{display:flex;gap:0;padding:0 20px;background:var(--bg);border-bottom:0.5px solid var(--border)}
.tr-rtab{padding:10px 16px;font-size:12.5px;font-weight:500;color:var(--text3);cursor:pointer;
  border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap}
.tr-rtab:hover{color:var(--navy)}
.tr-rtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tr-rtab .badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;text-align:center;
  line-height:18px;font-size:10px;margin-left:5px;padding:0 4px}
.tr-rtab.active .badge{background:var(--accent);color:#fff}
.tr-rtab:not(.active) .badge{background:var(--border);color:var(--text2)}
.tr-rpane{display:none;padding:14px 18px}
.tr-rpane.active{display:block}
.tr-filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tr-filter-bar label{font-size:11.5px;color:var(--text2);white-space:nowrap}
.tr-filter-bar select,.tr-filter-bar input{
  background:var(--bg);border:0.5px solid var(--border2);border-radius:7px;
  padding:6px 10px;font-size:12px;font-family:inherit;color:var(--text1);outline:none}
.tr-filter-bar input{min-width:160px}
.tr-tbl-wrap{overflow-x:auto;border-radius:8px;border:0.5px solid var(--border);max-height:460px;overflow-y:auto}
.tr-tbl{width:100%;border-collapse:collapse;font-size:12px}
.tr-tbl th{background:var(--bg);color:var(--text2);font-weight:500;padding:9px 10px;
  text-align:left;border-bottom:0.5px solid var(--border);white-space:nowrap;
  position:sticky;top:0;z-index:1}
.tr-tbl td{padding:7px 10px;border-bottom:0.5px solid var(--border);color:var(--text1);white-space:nowrap}
.tr-tbl tr:last-child td{border-bottom:none}
.tr-tbl tr:hover td{background:rgba(46,124,246,.03)}
.tr-tbl td.y{color:var(--success);font-weight:600}
.tr-tbl td.n{color:var(--text3)}
.tr-tbl td.warn{color:var(--warn);font-weight:500}
.tr-empty{text-align:center;padding:36px;color:var(--text3);font-size:13px}
.tr-empty i{font-size:32px;display:block;margin-bottom:8px;opacity:.2}
.tr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}


/* ===== 프로모션 ===== */
.pm-type-tabs{display:flex;gap:10px;margin-bottom:20px}
.pm-type-tab{
  padding:11px 28px;border-radius:9px;font-size:14px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);color:var(--text2);
  background:var(--surface);transition:all .18s;display:flex;align-items:center;gap:7px;
}
.pm-type-tab:hover{border-color:var(--accent);color:var(--navy)}
.pm-type-tab.active.ym{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.pm-type-tab.active.r13{background:#7c3aed;border-color:#7c3aed;color:#fff}
.pm-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.pm-input-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:20px}

<script>
// ========== STORAGE ==========
const USERS_KEY = 'biz_users';
const DATA_KEY  = 'biz_data';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch { return {}; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getData() {
  try { return JSON.parse(localStorage.getItem(DATA_KEY) || '{}'); } catch { return {}; }
}
function saveData(d) {
  // 저장 실패 시 오래된 월 데이터 순서대로 제거 후 재시도
  const str = JSON.stringify(d);
  try {
    localStorage.setItem(DATA_KEY, str);
  } catch(e) {
    // 월 키 목록 (YYYY-MM 형태) 오래된 순 정렬
    const months = Object.keys(d)
      .filter(k => /^\d{4}-\d{2}$/.test(k))
      .sort();
    let trimmed = { ...d };
    for (const m of months) {
      delete trimmed[m];
      try {
        localStorage.setItem(DATA_KEY, JSON.stringify(trimmed));
        console.warn('saveData: 용량 초과로 ' + m + ' 월 데이터 삭제');
        return;
      } catch(e2) { continue; }
    }
    // 그래도 안 되면 빈 객체로 초기화
    try { localStorage.setItem(DATA_KEY, '{}'); } catch(e3) {}
    console.error('saveData: 저장 실패, 초기화됨');
  }
}

// ========== MONTH SELECTOR ==========
function initMonths() {
  const sel = document.getElementById('month-sel');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const val = `${y}-${String(m).padStart(2,'0')}`;
    const label = `${y}년 ${m}월`;
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
  currentMonth = sel.value;
  updateMonthBadge();
}

function updateMonthBadge() {
  const sel = document.getElementById('month-sel');
  const label = sel.options[sel.selectedIndex]?.textContent || currentMonth;
  document.getElementById('month-badge').textContent = label;
}

function onMonthChange() {
  currentMonth = document.getElementById('month-sel').value;
  updateMonthBadge();
  renderPage(currentPage);
}

function currentMonthLabel() {
  const sel = document.getElementById('month-sel');
  return sel.options[sel.selectedIndex]?.textContent || currentMonth;
}

function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  MENUS.forEach(m => {

    grp.className = 'nav-group';
    if (m.children.length === 0) {
      const p = document.createElement('div');
      p.className = 'nav-parent' + (m.id === currentPage ? ' active' : '');
      p.innerHTML = `<i class="ti ${m.icon} menu-icon"></i><span>${m.label}</span>`;
      p.onclick = () => navigate(m.id, m.label, '홈');
      grp.appendChild(p);
    } else {
      const isOpen = m.children.some(c => c.id === currentPage);
      const p = document.createElement('div');
      p.className = 'nav-parent' + (isOpen ? ' open' : '');
      p.innerHTML = `<i class="ti ${m.icon} menu-icon"></i><span>${m.label}</span><i class="ti ti-chevron-down arrow"></i>`;

// ========== FILE UPLOAD ==========
function handleFile(e, pageId, pageLabel) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.csv')) {
    alert('현재 CSV 파일만 지원합니다.\nExcel 파일은 "다른 이름으로 저장 > CSV UTF-8" 형식으로 변환 후 업로드하세요.');
    e.target.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    const text = ev.target.result;
    const rows = parseCSV(text);
    if (rows.length === 0) {
      alert('파싱된 데이터가 없습니다. 파일 형식을 확인하세요 (CSV UTF-8).'); return;
    }
    savePageData(pageId, rows);
    renderPage(currentPage);
  };
  reader.onerror = () => {
    // UTF-8 실패시 EUC-KR 재시도
    const r2 = new FileReader();
    r2.onload = ev2 => {
      const rows = parseCSV(ev2.target.result);
      if (rows.length === 0) { alert('파일을 읽을 수 없습니다.'); return; }
      savePageData(pageId, rows);
      renderPage(currentPage);
    };
    r2.readAsText(file, 'EUC-KR');
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = splitCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = vals[idx] ?? ''; });
    rows.push(obj);
  }
  return rows;
}

function splitCSVLine(line) {
  const result = [];
  let cur = ''; let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      result.push(cur.trim()); cur = '';
    } else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

// 페이지별 인메모리 캐시 (새로고침 시 소멸)
const _pageCache = {};

function savePageData(pageId, rows) {
  // 원본 행은 메모리에만 (localStorage 용량 초과 방지)
  _pageCache[currentMonth + '_' + pageId] = rows;
  // localStorage에는 메타(건수·파일명)만 저장
  const data = getData();
  if (!data[currentMonth]) data[currentMonth] = {};
  data[currentMonth][pageId] = { _meta: true, count: rows.length };
  saveData(data);
}

function getPageData(pageId) {
  // 메모리 우선, 없으면 localStorage (이전 버전 호환)
  const cached = _pageCache[currentMonth + '_' + pageId];
  if (cached) return cached;
  const stored = (getData()[currentMonth] || {})[pageId];
  if (!stored) return null;
  if (stored._meta) return null;  // 메타만 있음 → 파일 재업로드 필요
  return stored;  // 이전 버전 데이터
}

// ========== RESET ==========
function confirmReset(pageId, label) {
  const ml = currentMonthLabel();
  document.getElementById('confirm-title').textContent = '데이터 초기화';
  document.getElementById('confirm-msg').textContent = `[${label}] ${ml} 데이터를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.`;
  document.getElementById('confirm-ok').onclick = () => {
    // 메모리 캐시 삭제
    delete _pageCache[currentMonth + '_' + pageId];
    // localStorage 메타도 삭제
    const data = getData();
    if (data[currentMonth] && data[currentMonth][pageId]) {
      delete data[currentMonth][pageId];
      saveData(data);
    }
    closeConfirm();
    renderPage(currentPage);
  };
  document.getElementById('confirm-modal').style.display = 'block';
}

function closeConfirm() {
  document.getElementById('confirm-modal').style.display = 'none';
}

function doLogin() {
  const emp = document.getElementById('inp-empno').value.trim();
  const pw  = document.getElementById('inp-pw').value;
  const err = document.getElementById('login-err');
  if (!emp || !pw) { err.style.display = 'block'; return; }

  const users = getUsers();
  const storedPw = users[emp]?.pw || emp; // 등록 없으면 사번=비번
  if (pw !== storedPw) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  currentUser = emp;
  document.getElementById('sidebar-empno').textContent = emp;

  const isFirst = !users[emp] || users[emp].forceChange;
  if (isFirst) {
    document.getElementById('pw-modal').style.display = 'block';
  } else {
    showDash();
  }
}

function changePw() {
  const p1  = document.getElementById('inp-newpw').value;
  const p2  = document.getElementById('inp-newpw2').value;
  const err = document.getElementById('pw-err');
  if (p1.length < 4) { err.textContent = '비밀번호는 4자리 이상이어야 합니다.'; err.style.display = 'block'; return; }
  if (p1 !== p2)     { err.textContent = '비밀번호가 일치하지 않습니다.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  const users = getUsers();
  users[currentUser] = { pw: p1, forceChange: false };
  saveUsers(users);
  document.getElementById('pw-modal').style.display = 'none';
  showDash();
}

function skipPw() {
  const users = getUsers();
  if (!users[currentUser]) users[currentUser] = { pw: currentUser, forceChange: true };
  saveUsers(users);
  document.getElementById('pw-modal').style.display = 'none';
  showDash();
}

function showDash() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display   = 'flex';
  initMonths();
  buildSidebar();
  navigate('home', '대시보드', '홈');

function doLogout() {
  document.getElementById('dashboard').style.display   = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-pw').value = '';
  document.getElementById('login-err').style.display = 'none';
  currentUser = ''; currentPage = 'home';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function arDragOver(e,id){e.preventDefault();document.getElementById(id).classList.add('drag-over')}
function arDragLeave(id){document.getElementById(id).classList.remove('drag-over')}

function arFileSelected(e,type){const f=e.target.files[0];if(f)arLoad(f,type);e.target.value=''}

function arLoad(file, type) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['xls','xlsx','xlsm'].includes(ext)){arSt(type,'err','Excel 파일만 지원합니다');return}
  arSt(type,'info','파일 읽는 중...');
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      AR[type]={file,wb};
      document.getElementById('arfn-'+type).textContent=file.name;
      document.getElementById('arfp-'+type).classList.add('show');
      const btn=document.getElementById('arbtn-'+type);
      btn.disabled=false; btn.classList.remove('disabled');
      arSt(type,'info','준비 완료. 변환 버튼을 클릭하세요.');
      arLog('info',`[${arName(type)}] 선택: ${file.name}`);
    }catch(err){arSt(type,'err','읽기 오류: '+err.message)}
  };
  r.readAsArrayBuffer(file);
}
function arClear(type){
  delete AR[type];
  document.getElementById('arfp-'+type).classList.remove('show');
  const btn=document.getElementById('arbtn-'+type);
  btn.disabled=true; btn.classList.add('disabled');
  btn.innerHTML='<i class="ti ti-refresh"></i> 변환 후 다운로드';
  arSt(type,'','');
}
function arName(t){return{kb:'KB라이프',lina:'라이나',cardif:'카디프'}[t]||t}
function arSt(type,cls,msg){const e=document.getElementById('arst-'+type);e.className='ar-status'+(cls?' '+cls:'');e.textContent=msg}
function arLog(cls,msg){
  const log=document.getElementById('ar-log'); if(!log)return;
  const now=new Date();
  const t=[now.getHours(),now.getMinutes(),now.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  if(log.children.length===1&&log.querySelector('.lt')?.textContent==='--:--:--')log.innerHTML='';
  const d=document.createElement('div');d.className='ar-log-item '+cls;
  d.innerHTML=`<span class="lt">${t}</span><span class="lm">${msg}</span>`;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function arConvert(type) {
  const {file,wb}=AR[type]||{};
  if(!wb)return;
  const btn=document.getElementById('arbtn-'+type);
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> 변환 중...';
  arSt(type,'info','변환 중...');
  arLog('info',`[${arName(type)}] 변환 시작`);
  try {
    let out;
    if(type==='kb')     out=arKB(wb);
    else if(type==='lina')   out=arLina(wb);
    else if(type==='cardif') out=arCardif(wb);
    const name=file.name.replace(/\.[^.]+$/,'')+'_변환.xlsx';
    XLSX.writeFile(out,name);
    arSt(type,'ok','✓ 완료 — 다운로드됨');
    arLog('ok',`[${arName(type)}] 완료 → ${name}`);
    btn.disabled=false; btn.classList.add('done');
    btn.innerHTML='<i class="ti ti-download"></i> 재다운로드';
  }catch(err){
    arSt(type,'err','오류: '+err.message);
    arLog('err',`[${arName(type)}] 오류: ${err.message}`);
    btn.disabled=false; btn.innerHTML='<i class="ti ti-refresh"></i> 다시 시도';
  }
}
function arKB(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  wb.SheetNames[0]='KB'; wb.Sheets['KB']=ws; delete wb.Sheets[wb.SheetNames[0]];
  wb.SheetNames=['KB'];
  const ref=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++){
    const a=XLSX.utils.encode_cell({r,c:22});
    if(ws[a]&&ws[a].v==='1개월납')ws[a]={t:'n',v:1,w:'1'};
  }
  return wb;
}
function arCardif(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const nm='카디프'; wb.SheetNames=[nm]; wb.Sheets={[nm]:ws};
  const ref=XLSX.utils.decode_range(ws['!ref']);
  for(let r=1;r<=ref.e.r;r++){
    const a=XLSX.utils.encode_cell({r,c:23});
    if(!ws[a])continue;
    if(ws[a].v==='월납')ws[a]={t:'n',v:1,w:'1'};
    else if(ws[a].v==='일시납')ws[a]={t:'n',v:99,w:'99'};
  }
  return wb;
}
function arLina(wb){
  const sn=wb.SheetNames.find(n=>n==='Sheet1_1')||wb.SheetNames[0];
  const ws=wb.Sheets[sn];
  wb.SheetNames=wb.SheetNames.map(n=>n===sn?'라이나':n);
  wb.Sheets['라이나']=ws; if(sn!=='라이나')delete wb.Sheets[sn];
  let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let last=aoa.length-1;
  while(last>=0&&(aoa[last][0]===''||aoa[last][0]==null))last--;
  if(last>=0)aoa.splice(last,1);
  for(let r=3;r<aoa.length;r++){
    const v=aoa[r][27];
    if(v==='월납')aoa[r][27]=1;
    else if(v==='일시납')aoa[r][27]=99;
  }
  for(let r=0;r<aoa.length;r++){
    const row=aoa[r];
    const y=row[24];
    const z=r===2?y:(r>=3?(isNaN(parseFloat(y))?y:Math.floor(parseFloat(y))):' ');
    row.splice(25,0,z); row.splice(24,1);
  }
  wb.Sheets['라이나']=XLSX.utils.aoa_to_sheet(aoa);
  return wb;
}

function ncDragOver(e,id){e.preventDefault();document.getElementById(id).classList.add('drag')}

function ncDropFile(e,type){e.preventDefault();ncDragLeave('ncd-'+type);const f=e.dataTransfer.files[0];if(f)ncLoad(f,type)}
function ncFileSelect(e,type){const f=e.target.files[0];if(f)ncLoad(f,type);e.target.value=''}

function ncLoad(file, type) {
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['xls','xlsx'].includes(ext)){alert('엑셀 파일(.xls/.xlsx)만 지원합니다');return}
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      NC.files[type]={file,wb};
      document.getElementById('ncfn-'+type).textContent=file.name;
      document.getElementById('ncfp-'+type).classList.add('show');
      // master 모드: 시트 감지 표시
      if(type==='master'){
        const sheets=wb.SheetNames;
        const found=ncDetectSheets(sheets);
        const si=document.getElementById('nc-sheet-info');
        if(si){
          si.innerHTML='<div style="font-size:11.5px;color:var(--text2);margin-bottom:6px">감지된 시트:</div>'
            + sheets.map(s=>`<span class="nc-sheet-tag">${s}</span>`).join('')
            + (found.insurer?`<div style="margin-top:8px;font-size:11.5px;color:var(--success);font-weight:500"><i class="ti ti-check"></i> 보험사: ${found.insurer==='kb'?'KB라이프':'카디프'}</div>`
              :`<div style="margin-top:8px;font-size:11.5px;color:var(--danger)">보험사 시트(KB/카디프)를 찾을 수 없습니다</div>`);
        }
      }
      ncCheckReady();
    }catch(err){alert('파일 읽기 오류: '+err.message)}
  };
  r.readAsArrayBuffer(file);
}

function ncCheckReady(){
  const btn=document.getElementById('nc-run-btn');
  const st=document.getElementById('nc-run-st');
  if(!btn)return;
  let ready=false, msg='파일을 업로드하세요';
  if(NC.mode==='master'){
    const m=NC.files.master;
    if(m){
      const f=ncDetectSheets(m.wb.SheetNames);
      ready=!!f.insurer&&!!f.iims;
      msg=ready?'대사 실행 준비 완료':(f.insurer?'IIMS 시트를 찾을 수 없습니다':'KB 또는 카디프 시트를 찾을 수 없습니다');
    }
  } else {
    ready=!!(NC.files.iims&&NC.files.raw);
    msg=ready?'대사 실행 준비 완료':'IIMS와 보험사 파일을 모두 업로드하세요';
  }
  btn.disabled=!ready;
  st.textContent=msg;
}

// 시트명 감지: {insurer, iims, rawSheet, prodSheet, refSheet}
function ncDetectSheets(names) {
  const r={};
  for(const n of names){
    const l=n.toLowerCase().replace(/\s/g,'');
    if(n==='KB'||l==='kb')         r.insurer='kb', r.rawSheet=n;
    else if(n==='카디프')           r.insurer='cardif', r.rawSheet=n;
    else if(n==='IIMS')             r.iims=n;
    else if(n==='참고')             r.refSheet=n;
    else if(n==='상품확인')         r.prodSheet=n;
  }
  return r;
}

// ── 대사 실행 ──────────────────────────────────────────────
async function ncRun(){
  const btn=document.getElementById('nc-run-btn');
  const st=document.getElementById('nc-run-st');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> 분석 중...';
  st.textContent='데이터 파싱 중...';
  try{
    let iimsWb, rawWb, ins, productMap, codeMap;

    if(NC.mode==='master'){
      const {wb}=NC.files.master;
      const det=ncDetectSheets(wb.SheetNames);
      ins=det.insurer;
      iimsWb=rawWb=wb;  // 같은 wb에서 각각 시트로 읽음
      const pm=new Map(), cm=new Map();
      // 참고 시트
      if(det.refSheet){
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[det.refSheet],{header:1,defval:''});
        for(let i=1;i<aoa.length;i++){
          const r2=aoa[i];
          const k=String(r2[1]||'').trim(), v=String(r2[2]||'').trim();
          if(k&&v)pm.set(k,v);
        }
      }
      // 상품확인 시트
      if(det.prodSheet){
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[det.prodSheet],{header:1,defval:''});
        for(let i=1;i<aoa.length;i++){
          const r2=aoa[i];
          const k=String(r2[2]||'').trim(), v=String(r2[3]||'').trim();
          if(k&&v)pm.set(k,v);
          const k2=String(r2[7]||'').trim(), c2=r2[8];
          if(k2&&c2)cm.set(k2,c2);
          const k3=String(r2[11]||'').trim(), c3=r2[12];
          if(k3&&c3)cm.set(k3,c3);
          // 카디프 상품코드
          const k4=String(r2[6]||'').trim(), c4=r2[7];
          if(k4&&c4)cm.set(k4,c4);
        }
      }
      productMap=pm; codeMap=cm;
      // IIMS 파싱
      const iimsMap=ncParseIIMS(wb, det.iims);
      // 원본 파싱
      const rawMap=ins==='kb'?ncParseKB(wb,det.rawSheet):ncParseCardif(wb,det.rawSheet);
      st.textContent='비교 중...';
      NC.results=ncCompare(rawMap,iimsMap,productMap,codeMap,ins);
    } else {
      ins=NC.insurer;
      const iWb=NC.files.iims.wb, rWb=NC.files.raw.wb;
      // IIMS: 첫 번째 시트를 IIMS 데이터로 간주
      const iimsMap=ncParseIIMS(iWb, iWb.SheetNames[0]);
      // 원본: 첫 번째 시트를 보험사 데이터로 간주
      const rawMap=ins==='kb'?ncParseKB(rWb,rWb.SheetNames[0]):ncParseCardif(rWb,rWb.SheetNames[0]);
      // 상품 매핑: 원본 파일에 참고/상품확인 시트가 있으면 사용
      const pm=new Map(), cm=new Map();
      for(const sn of rWb.SheetNames){
        if(sn==='참고'){
          const aoa=XLSX.utils.sheet_to_json(rWb.Sheets[sn],{header:1,defval:''});
          for(let i=1;i<aoa.length;i++){const r2=aoa[i];const k=String(r2[1]||'').trim(),v=String(r2[2]||'').trim();if(k&&v)pm.set(k,v)}
        }
        if(sn==='상품확인'){
          const aoa=XLSX.utils.sheet_to_json(rWb.Sheets[sn],{header:1,defval:''});
          for(let i=1;i<aoa.length;i++){const r2=aoa[i];
            const k=String(r2[2]||'').trim(),v=String(r2[3]||'').trim();if(k&&v)pm.set(k,v);
            const k2=String(r2[7]||'').trim(),c2=r2[8];if(k2&&c2)cm.set(k2,c2);
            const k3=String(r2[11]||'').trim(),c3=r2[12];if(k3&&c3)cm.set(k3,c3);
            const k4=String(r2[6]||'').trim(),c4=r2[7];if(k4&&c4)cm.set(k4,c4);
          }
        }
      }
      productMap=pm; codeMap=cm;
      NC.results=ncCompare(rawMap,iimsMap,pm,cm,ins);
    }

    btn.disabled=false;
    btn.innerHTML='<i class="ti ti-git-compare"></i> 대사 재실행';
    st.textContent=`완료 — 총 ${NC.results.total}건 비교`;
    document.getElementById('nc-result-area').innerHTML=ncResultHTML(NC.results);
  }catch(err){
    btn.disabled=false;
    btn.innerHTML='<i class="ti ti-git-compare"></i> 대사 실행';
    st.textContent='오류: '+err.message;
    console.error(err);
  }
}

// ── 파싱 ──────────────────────────────────────────────────
function ncParseIIMS(wb, sheetName) {
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error(`IIMS 시트(${sheetName})를 찾을 수 없습니다`);
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  // row0=인덱스번호행, row1=헤더, row2+=데이터
  const hdrs=aoa[1]||[];
  const map=new Map();
  for(let i=2;i<aoa.length;i++){
    const r=aoa[i];
    const no=String(r[2]||'').trim();
    if(!no)continue;
    const o={}; hdrs.forEach((h,j)=>{if(h)o[h]=r[j]});
    map.set(no,o);
  }
  return map;
}

function ncParseKB(wb, sheetName) {
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error(`KB 시트(${sheetName})를 찾을 수 없습니다`);
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hdrs=aoa[1]||[];
  const map=new Map();
  for(let i=2;i<aoa.length;i++){
    const r=aoa[i];
    const no=String(r[3]||'').trim(); // 증권번호 col3
    if(!no)continue;
    const o={}; hdrs.forEach((h,j)=>{if(h)o[h]=r[j]});
    map.set(no,o);
  }
  return map;
}

function ncParseCardif(wb, sheetName) {
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error(`카디프 시트(${sheetName})를 찾을 수 없습니다`);
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hdrs=aoa[1]||[];
  const map=new Map();
  for(let i=2;i<aoa.length;i++){
    const r=aoa[i];
    const no=String(r[1]||'').trim(); // 증권번호 col1
    if(!no)continue;
    const o={}; hdrs.forEach((h,j)=>{if(h)o[h]=r[j]});
    map.set(no,o);
  }
  return map;
}

// ── 비교 ──────────────────────────────────────────────────
function ncN(v){return Math.round(parseFloat(String(v||0).replace(/,/g,'')))||0}
function ncNapgi(v){return String(v||'').split('/')[0].trim()}
// IIMS 상태 중 "변경이 필요한" 상태 목록
const IIMS_NEEDS_CHANGE = new Set(['정상','시효','실효','유예']);

function ncSt(s){
  s=String(s||'').replace('(유지)','').replace('(소멸)','').trim();
  if(s==='정상') return '정상';
  if(s.includes('계류')) return '계류';
  // 철회 계열 — 성립전/후/청약/철회 모두 '철회'로 통일
  if(s.includes('성립후철회')||s.includes('성립전철회')||
     s.includes('청약철회')||s.includes('철회')) return '철회';
  if(s.includes('반송')) return '반송';
  if(s.includes('해약')||s.includes('해지')) return '해약';
  if(s.includes('품보취소')||s.includes('취소')) return '계약취소';
  if(s.includes('시효')) return '시효';
  if(s.includes('실효')) return '실효';
  if(s.includes('유예')) return '유예';
  return s;
}
function ncProdMatch(a,b){
  if(!a||!b)return false;
  const s=x=>x.split('(')[0].replace(/[\s_]/g,'').toLowerCase();
  return s(a)===s(b)||a.includes(b)||b.includes(a);
}

const NC_INS_CODE={kb:38,cardif:56,lina:44};
function ncCompare(rawMap,iimsMap,productMap,codeMap,ins){
  const res={ins,total:0,matched:0,onlyRaw:[],onlyIIMS:[],
    statusDiff:[],napgiDiff:[],productDiff:[],hwanDiff:[],premiDiff:[]};

  rawMap.forEach((raw,no)=>{
    res.total++;
    const iims=iimsMap.get(no);
    if(!iims){res.onlyRaw.push(no);return}
    res.matched++;
    const b={증번:no};

    // 상태
    const rawStRaw=String(raw['계약상태']||raw['상태']||'').trim();
    const iimsStRaw=String(iims['상태']||'').trim();
    const rawSt=ncSt(rawStRaw);
    const iimsSt=ncSt(iimsStRaw);
    const 변경일raw=String(raw['계약상태변경일']||raw['계약변경일자']||'').replace(/-/g,'');

    if(rawSt!=='정상'){
      // 계류: 아예 제외
      if(rawSt==='계류'){
        // skip
      }
      // 철회계열: IIMS가 시효/실효/유예/정상이면 변경 필요
      else if(rawSt==='철회'){
        if(IIMS_NEEDS_CHANGE.has(iimsSt)){
          res.statusDiff.push({...b,
            보험사상태:rawStRaw, iims상태:iimsStRaw,
            변경일:변경일raw, 코드:1, 비고:'', 당월제외:false
          });
        }
      }
      // 반송: IIMS가 시효/실효/유예/정상이면 변경 필요
      else if(rawSt==='반송'){
        if(IIMS_NEEDS_CHANGE.has(iimsSt)){
          res.statusDiff.push({...b,
            보험사상태:rawStRaw, iims상태:iimsStRaw,
            변경일:변경일raw, 코드:3, 비고:'', 당월제외:false
          });
        }
      }
      // 해약: IIMS가 시효/실효/유예/정상이면 변경 필요
      // 단, 변경일이 작업 당월이면 업로드 파일에서만 제외 (화면엔 표시)
      else if(rawSt==='해약'){
        if(IIMS_NEEDS_CHANGE.has(iimsSt)){
          const today=new Date();
          const 작업년월=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}`;
          const 변경년월=변경일raw.slice(0,6);
          const 당월제외=변경년월===작업년월;
          res.statusDiff.push({...b,
            보험사상태:rawStRaw, iims상태:iimsStRaw,
            변경일:변경일raw, 코드:0, 비고:당월제외?'당월해약(업로드제외)':'', 당월제외
          });
        }
      }
    }

    // 납기
    const rawNp=String(raw['납입기간']||'').trim();
    const iimsNp=ncNapgi(String(iims['납기/만기']||''));
    if(rawNp&&iimsNp&&rawNp!==iimsNp){
      res.napgiDiff.push({...b,보험사납기:rawNp,iims납기:iimsNp,iims원본:String(iims['납기/만기']||'')});
    }

    // 상품
    const rawProd=String(raw['상품']||raw['상품명']||'').trim();
    const iimsProd=String(iims['보험상품']||'').trim();
    const mapped=productMap.get(rawProd)||'';
    const code=codeMap.get(rawProd)||codeMap.get(mapped)||String(iims['상품코드']||'');
    if(mapped&&!ncProdMatch(mapped,iimsProd)){
      res.productDiff.push({...b,보험사상품:rawProd,매핑상품:mapped,iims상품:iimsProd,코드:code});
    }

    // 환산
    const isIlsi=ins==='cardif'&&String(raw['납입방법']||raw['납입주기']||'').includes('일시납');
    const rH1=ncN(raw[ins==='kb'?'환산성적(초년도)':'1차년 환산성적']);
    const rH2=ncN(raw[ins==='kb'?'환산성적(2차년도)':'2차년 환산성적']);
    const rH3=ncN(raw[ins==='kb'?'환산성적(3차년도)':'3차년 환산성적']);
    const rH4=0; // 보험사 4차 환산 없음 → 항상 0
    const iH1=ncN(iims['환산월초']), iH2=ncN(iims['2차환산월초']),
          iH3=ncN(iims['3차환산월초']), iH4=ncN(iims['4차환산월초']);
    const cH1=isIlsi?rH1+rH2:rH1;
    // KB: 1~3차 불일치 OR IIMS 4차가 0이 아닌 경우 → 업로드 대상
    const kb4chk = ins==='kb' && iH4!==0;
    const diff123 = cH1!==iH1||(isIlsi?false:rH2!==iH2)||(isIlsi?false:rH3!==iH3);
    if(diff123 || kb4chk){
      res.hwanDiff.push({...b,일시납:isIlsi,rH1,rH2,rH3,rH4,cH1,iH1,iH2,iH3,iH4,kb4chk});
    }

    // 보험료
    const rP=ncN(raw['보험료']), iP=ncN(iims['영수금액']);
    if(rP&&iP&&rP!==iP) res.premiDiff.push({...b,보험사:rP,iims:iP,차이:rP-iP});
  });

  iimsMap.forEach((_,no)=>{if(!rawMap.has(no))res.onlyIIMS.push(no)});
  return res;
}

function ncResultHTML(r){

    const b=t.cnt!==null?`<span class="badge">${t.cnt}</span>`:'';
    return `<div class="nc-rtab ${t.id===NC.rtab?'active':''} ${t.cnt>0?'has-diff':''}"

      <div class="nc-rpane ${id===NC.rtab?'active':''}" id="ncrp-${id}">

function ncRTab(id){
  NC.rtab=id;
  document.querySelectorAll('.nc-rtab').forEach(el=>{
    const match=el.getAttribute('onclick')?.includes("'"+id+"'");
    el.classList.toggle('active',match);
  });
  document.querySelectorAll('.nc-rpane').forEach(el=>{
    el.classList.toggle('active',el.id==='ncrp-'+id);
  });
}

    <thead><tr><th>보험사코드</th><th>증번</th><th>보험사 보험료</th><th>IIMS 영수금액</th><th>차이</th></tr></thead>

// ── TXT 다운로드 (헤더 없음, 내용만) ────────────────────
function ncDl(cat){
  const r=NC.results; if(!r)return;
  const code=NC_INS_CODE[r.ins]||'';
  let lines=[], fn='';
  const d=new Date().toISOString().slice(0,10);

  if(cat==='status'){
    // 보험사코드 증번 상태변경일(YYYYMMDD) 상태코드
    fn=`상태변경_${r.ins}_${d}.txt`;
    r.statusDiff.forEach(x=>{
      if(x.당월제외) return;  // 당월 해약 업로드 제외
      const dt=String(x.변경일).replace(/-/g,'').slice(0,8);
      lines.push([code, x.증번, dt, x.코드].join('\t'));
    });

  }else if(cat==='napgi'){
    // 보험사코드 증번 납기(예: 5년)
    fn=`납기변경_${r.ins}_${d}.txt`;
    r.napgiDiff.forEach(x=>{
      lines.push([code, x.증번, x.보험사납기].join('\t'));
    });

  }else if(cat==='product'){
    // 보험사코드 증번 상품코드
    fn=`상품변경_${r.ins}_${d}.txt`;
    r.productDiff.filter(x=>x.코드).forEach(x=>{
      lines.push([code, x.증번, x.코드].join('\t'));
    });

  }else if(cat==='hwan'){
    // 보험사코드 증번 1차 2차 3차 4차
    fn=`환산변경_${r.ins}_${d}.txt`;
    r.hwanDiff.forEach(x=>{
      lines.push([code, x.증번, x.rH1, x.rH2, x.rH3, x.rH4].join('\t'));
    });

  }else if(cat==='premi'){
    // 보험사코드 증번 초회보험료(숫자만, 쉼표 없음)
    fn=`초회수정_${r.ins}_${d}.txt`;
    r.premiDiff.forEach(x=>{
      lines.push([code, x.증번, x.보험사].join('\t'));
    });
  }

  // UTF-8 BOM, 헤더 없이 내용만
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fn; a.click();
  URL.revokeObjectURL(a.href);
}

function pmPdfDrag(e){ e.preventDefault(); document.getElementById('pm-pdf-drop').classList.add('drag'); }

async function pmReadPdf(file) {
  if(!file.name.toLowerCase().endsWith('.pdf')){ alert('PDF 파일만 지원합니다'); return; }
  const st = document.getElementById('pm-pdf-status');
  st.style.color = 'var(--accent)';
  st.textContent = '📄 PDF 읽는 중...';

  try {
    // PDF.js workerSrc 설정
    if(window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    } else {
      st.style.color='var(--danger)';
      st.textContent='PDF.js 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인하세요.';
      return;
    }

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

    let fullText = '';
    for(let p=1; p<=pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      // 같은 y좌표(행)끼리 묶어서 줄 단위로 재구성
      const items = content.items;
      if(!items.length) continue;

      // y 기준으로 그룹화 (소수점 1자리 반올림으로 같은 행 판단)
      const lineMap = new Map();
      for(const item of items){
        const y = Math.round(item.transform[5]);
        if(!lineMap.has(y)) lineMap.set(y,[]);
        lineMap.get(y).push({x:item.transform[4], text:item.str});
      }
      // y 내림차순(위→아래) 정렬 후 각 행을 x 오름차순으로 합치기
      const sortedYs = [...lineMap.keys()].sort((a,b)=>b-a);
      for(const y of sortedYs){
        const sorted = lineMap.get(y).sort((a,b)=>a.x-b.x);
        const lineText = sorted.map(i=>i.text).join(' ').trim();
        if(lineText) fullText += lineText + '\n';
      }
    }

    // 텍스트 영역에 채우고 상태 표시
    document.getElementById('pm-parse-text').value = fullText;
    st.style.color = 'var(--success)';
    st.textContent = `✓ ${pdf.numPages}페이지 추출 완료 — 아래에서 확인 후 "텍스트 파싱하여 추가" 클릭`;
  } catch(err) {
    st.style.color='var(--danger)';
    st.textContent='오류: ' + err.message;
    console.error(err);
  }
}

// ── 텍스트 파싱 ───────────────────────────────────────────
function pmParseText() {
  const rawText = document.getElementById('pm-parse-text')?.value || '';
  const ins     = document.getElementById('pm-parse-ins')?.value || 'KB라이프';
  const month   = document.getElementById('pm-parse-month')?.value.trim() || pmThisMonth();

  const lines = rawText.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;

  for (const line of lines) {
    // 숫자%를 찾는 패턴
    // 예: "7년의약속 플러스 평생종신보험 일반   300%   800%"
    // 패턴: 마지막 1~2개의 숫자(%) 토큰을 rate로, 나머지를 상품명으로
    const tokens = line.split(/[\t]+|[ ]{2,}/).map(t=>t.trim()).filter(Boolean);
    if (tokens.length < 2) continue;

    // 뒤에서부터 숫자% 추출
    const rates = [];
    let nameTokens = [...tokens];
    while (nameTokens.length > 1) {
      const last = nameTokens[nameTokens.length-1].replace('%','').replace(',','');
      if (/^[\d.]+$/.test(last) || last === '-' || last === '–') {
        rates.unshift(nameTokens.pop().replace('%','').replace('-','').replace('–',''));
      } else break;
    }
    if (rates.length === 0) continue; // 숫자 없으면 스킵

    const product = nameTokens.join(' ').trim();
    if (!product) continue;

    const r1 = rates[0] || '';
    const r2 = rates[1] || '';
    PM.rows.push({ type:PM.type, ins, month, product, rate1:r1, rate2:r2 });
    added++;
  }

  if (added > 0) {
    document.getElementById('pm-parse-text').value = '';
    pmRefreshTable();
    alert(`${added}개 항목이 추가되었습니다.`);
  } else {
    alert('파싱된 항목이 없습니다.\n형식: 상품명[탭 또는 공백2개이상]숫자%');
  }
}

function pmSave() {
  if (!PM.rows.length) { alert('저장할 항목이 없습니다'); return; }
  const key = prompt('저장 이름을 입력하세요 (예: KB_2026-05_익월)');
  if (!key) return;
  const saved = pmGetSaved();
  saved[key] = { rows: PM.rows, savedAt: new Date().toISOString() };
  pmSetSaved(saved);
  // select 갱신
  renderPromotion(document.getElementById('content-area'));
  alert(`"${key}" 로 저장되었습니다.`);
}

  const sel = document.getElementById('pm-saved-sel');
  const key = sel?.value;
  if (!key) { alert('불러올 양식을 선택하세요'); return; }
  const saved = pmGetSaved();
  if (!saved[key]) { alert('저장된 데이터를 찾을 수 없습니다'); return; }
  PM.rows = saved[key].rows || [];
  renderPromotion(document.getElementById('content-area'));
}

// ── 저장 양식 삭제 ────────────────────────────────────────
function pmDelSaved() {
  const sel = document.getElementById('pm-saved-sel');
  const key = sel?.value;
  if (!key) { alert('삭제할 양식을 선택하세요'); return; }
  if (!confirm(`"${key}" 양식을 삭제하시겠습니까?`)) return;
  const saved = pmGetSaved();
  delete saved[key];
  pmSetSaved(saved);
  renderPromotion(document.getElementById('content-area'));

function pmDownload() {
  if (!PM.rows.length) { alert('다운로드할 항목이 없습니다'); return; }
  const T = '\t';
  const lines = PM.rows.map(r =>
    [pmTypeLabel(r.type), r.ins, r.month, r.product,
     r.rate1?r.rate1+'%':'', r.rate2?r.rate2+'%':'',
     pmTotal(r)].join(T)
  );
  const bom = '\uFEFF';
  const blob = new Blob([bom+lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `프로모션_${pmThisMonth()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function trAccumRun(){
  const btn=document.getElementById('tr-accum-btn');
  const st=document.getElementById('tr-accum-st');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> 처리 중...';

  try{
    const [malsoWb,listWb]=await Promise.all([trReadXLSX(TR.accum.malso),trReadXLSX(TR.accum.list)]);

    // malso: Sheet1 → 결재완료 문서번호 Set
    const malsoAoa=XLSX.utils.sheet_to_json(malsoWb.Sheets[malsoWb.SheetNames[0]],{header:1,defval:''});
    // 헤더: 문서번호(0), 결재상태(11)
    const approvedDocs=new Set();
    for(let i=1;i<malsoAoa.length;i++){
      if(trV(malsoAoa[i][11])==='결재완료') approvedDocs.add(trV(malsoAoa[i][0]));
    }
    st.textContent=`malso 결재완료 ${approvedDocs.size}건 확인`;

    // 말소신청 Sheet1: 당월 대상
    const ws1=listWb.Sheets['Sheet1'];
    if(!ws1) throw new Error('말소신청 파일에 Sheet1 시트가 없습니다');
    const sheet1Aoa=XLSX.utils.sheet_to_json(ws1,{header:1,defval:''});
    // 헤더: 문서번호(0), 기결재확인(1), 말소결재대상확인(2)
    // 기결재에 없고 말소결재대상 or 기결재확인 있는 건
    const hdrs=sheet1Aoa[0]; // 헤더

    // 기결재 시트: 기존 누적 데이터
    const wsGK=listWb.Sheets['기결재'];
    if(!wsGK) throw new Error('말소신청 파일에 기결재 시트가 없습니다');
    const gkAoa=XLSX.utils.sheet_to_json(wsGK,{header:1,defval:''});
    // 기결재 헤더(2행): doc_no(0)...
    const existingDocs=new Set();
    for(let i=2;i<gkAoa.length;i++) if(gkAoa[i][0]) existingDocs.add(trV(gkAoa[i][0]));

    // 당월 추가 대상: Sheet1에서 기결재에 없는 건 중 결재완료인 건
    const gkHeaders=gkAoa[1]||[]; // 기결재 헤더
    const newRows=[];
    const today=new Date();
    const yyyymm=today.getFullYear()*100+(today.getMonth()+1); // 당월 YYYYMM

    for(let i=1;i<sheet1Aoa.length;i++){
      const r=sheet1Aoa[i];
      const docNo=trV(r[0]);
      if(!docNo) continue;
      if(existingDocs.has(docNo)) continue; // 이미 기결재에 있음
      if(!approvedDocs.has(docNo)) continue; // 결재완료가 아님
      // 기결재 형식으로 변환: doc_no, 보험사, 증번, 계약자, 상품명, 최종월도, 회차, 상태, 변경전사원명, 변경전사원번호, 변경전사용인코드, 변경전변액유무, 변경후사원명, 변경후사원번호, 변경후사용인코드, 변경후변액유무, 월도
      // Sheet1 컬럼: 문서번호(0), 기결재확인(1), 말소결재대상확인(2), 보험사(3), 증번(4), 계약자(5), 상품명(6), 최종월도(7), 회차(8), 상태(9), 변경전사원명(10), 변경전사원번호(11), 변경전사용인코드(12), 변경전변액유무(13), 변경후사원명(14), 변경후사원번호(15), 변경후사용인코드(16), 변경후변액유무(17)
      newRows.push([
        docNo, r[3], r[4], r[5], r[6], r[7], r[8], r[9],
        r[10], r[11], r[12], r[13],
        r[14], r[15], r[16], r[17],
        yyyymm
      ]);
    }

    if(newRows.length===0){
      st.textContent='추가할 신규 기결재 건이 없습니다.';
      btn.disabled=false; btn.innerHTML='<i class="ti ti-stack-push"></i> 기결재 누적 실행';

        <div class="tr-empty"><i class="ti ti-check"></i><p>신규 추가 건 없음 — 이미 모든 결재완료 건이 기결재에 포함되어 있습니다</p></div>`;

    // 결과 엑셀 생성: 기결재 기존 + 신규 추가
    const outAoa=[gkAoa[0], gkAoa[1], ...gkAoa.slice(2).filter(r=>r[0]), ...newRows];
    const outWs=XLSX.utils.aoa_to_sheet(outAoa);
    const outWb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(outWb,outWs,'기결재');
    const fname=`말소신청생보이관리스트_기결재누적_${today.toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(outWb,fname);

    st.textContent=`완료 — 신규 ${newRows.length}건 추가 / 총 ${existingDocs.size+newRows.length}건`;
    btn.disabled=false; btn.innerHTML='<i class="ti ti-download"></i> 재다운로드';

    document.getElementById('tr-accum-result').innerHTML=`
    <div class="tr-result">
      <div class="tr-result-hd">
        <h3><i class="ti ti-check"></i> 누적 완료</h3>
        <div class="nc-pills">
          <div class="nc-pill ok"><i class="ti ti-database"></i> 기존 ${existingDocs.size}건</div>
          <div class="nc-pill diff"><i class="ti ti-plus"></i> 신규 추가 ${newRows.length}건</div>
        </div>
      </div>
      <div style="padding:14px 18px">
        <div class="tr-tbl-wrap"><table class="tr-tbl">
          <thead><tr><th>문서번호</th><th>보험사</th><th>증번</th><th>계약자</th><th>상품명</th><th>상태</th><th>변경전사원</th><th>변경후사원</th></tr></thead>
          <tbody>${newRows.map(r=>`<tr>
            <td>${trEsc(r[0])}</td><td>${trEsc(r[1])}</td><td>${trEsc(r[2])}</td>
            <td>${trEsc(r[3])}</td><td>${trEsc(r[4])}</td><td>${trEsc(r[7])}</td>
            <td>${trEsc(r[8])}</td><td>${trEsc(r[12])}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>`;
  }catch(err){
    st.textContent='오류: '+err.message; console.error(err);
    btn.disabled=false; btn.innerHTML='<i class="ti ti-stack-push"></i> 다시 시도';
  }
}

async function trStatusLoad(file){
  if(!file)return;
  TR.status.file=file;
  document.getElementById('trfn-status').textContent=file.name;
  document.getElementById('trfp-status').classList.add('show');
  try{
    const wb=await trReadXLSX(file);
    // 전체 or Data 시트 사용
    const sn=wb.SheetNames.find(n=>n==='전체')||wb.SheetNames.find(n=>n==='Data')||wb.SheetNames[0];
    const ws=wb.Sheets[sn];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    // 헤더는 2행
    const hdrs=aoa[1]||[];
    const rows=[];
    for(let i=2;i<aoa.length;i++){
      const r=aoa[i];
      if(!r[0]&&!r[3]) continue; // NO. 또는 증번 없으면 스킵
      rows.push({
        no:trV(r[0]), path:trV(r[1]), ins:trV(r[2]), no_:trV(r[3]),
        holder:trV(r[4]), product:trV(r[5]), lastMonth:trV(r[6]), cnt:trV(r[7]),
        status:trV(r[8]),
        from_name:trV(r[9]), from_code:trV(r[10]), from_ins_code:trV(r[11]), from_va:trV(r[12]),
        to_name:trV(r[13]), to_code:trV(r[14]), to_ins_code:trV(r[15]), to_va:trV(r[16]),
        iims_req:trV(r[17]), ins_req:trV(r[18]), note:trV(r[19]),
        malso_type:trV(r[20])
      });
    }
    TR.status.data=rows;
    TR.status.tab='all';
    document.getElementById('tr-status-result').innerHTML=trStatusHTML();
  }catch(err){
    alert('파일 읽기 오류: '+err.message); console.error(err);
  }
}

async function trYeongjiLoad(file){
  if(!file)return;
  TR.yeongji.file=file;
  document.getElementById('trfn-yeongji').textContent=file.name;
  document.getElementById('trfp-yeongji').classList.add('show');
  try{
    const wb=await trReadXLSX(file);
    const sn=wb.SheetNames.find(n=>n==='이관')||wb.SheetNames[0];
    const ws=wb.Sheets[sn];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    // 헤더: 3행 (index 2)
    const hdrs=aoa[2]||[];
    const rows=[];
    for(let i=3;i<aoa.length;i++){
      const r=aoa[i];
      if(!r[5]&&!r[10]) continue;
      rows.push({
        결재여부:trV(r[0]), 접수일:trV(r[1]), 신청자:trV(r[2]), 소속:trV(r[3]),
        파트너:trV(r[4]), 사원번호:trV(r[5]), 이름:trV(r[10]),
        손보말소:trV(r[8]), 생보말소:trV(r[9]),
        진행사항:trV(r[10==='이름'?10:10]), 말소방법:trV(r[11]), 말소구분:trV(r[12]),
        말소사유선택:trV(r[13]), 말소사유:trV(r[14])
      });
      // fix: 이름은 col 10 = index 10 → 실제 시트 확인 필요, 여기선 aoa[i]기준
      rows[rows.length-1].이름=trV(aoa[i][10]);
      rows[rows.length-1].진행사항=trV(aoa[i][10]);
      // 재매핑
      rows[rows.length-1]={
        결재여부:trV(r[0]), 접수일:trV(r[1]), 신청자:trV(r[2]), 소속:trV(r[3]),
        파트너:trV(r[4]), 사원번호:trV(r[5]), 이름:trV(r[6]),
        주민번호:trV(r[7]).replace(/(\d{6})\d{7}/,'$1*******'),
        손보말소:trV(r[8]), 생보말소:trV(r[9]),
        진행사항:trV(r[10]), 말소방법:trV(r[11]), 말소구분:trV(r[12]),
        말소사유선택:trV(r[13]), 말소사유:trV(r[14])
      };
    }
    TR.yeongji.data=rows;
    document.getElementById('tr-yeongji-result').innerHTML=trYeongjiHTML();
  }catch(err){alert('파일 읽기 오류: '+err.message);console.error(err);}
}

/*
  [정리 시트 수식 JS 재현]
  1. 작업 대상 풀 = IIMS에서
       상태 ∈ {정상,유예,시효,실효,납입면제} AND 납방 ≠ 일시납
  2. KB XLOOKUP: 보험료·최종납입월·입금일자·계약상태
     IIMS XLOOKUP: 최종월도·회차·상태
  3. 월도차이 = KB최종납입월 - IIMS최종월도 (납입면제면 0 강제)
  4. 분류
     월도차이 > 0  →  업로드 대상
       (말일자) 입금일자 > 수금마감일 → 제외(익월)
       (말일자) 입금일자 = 수금마감일 + 동일증번 복수 → 수기확인
     월도차이 < 0  →  수기확인(역전)
     월도차이 = 0  →  스킵(이미반영)
  [업로드 포맷]
  보험사코드(38) | 증권번호 | 보험료 | 최종납입월(yyyymm) | 입금일자(yyyymmdd)
*/

// ── 파일 핸들러 ───────────────────────────────
function cHandleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array', cellDates:true });
      cParseWorkbook(wb, file.name);
    } catch(err) { alert('파일 읽기 오류: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

// ── 워크북 파싱 ───────────────────────────────
function cParseWorkbook(wb, fileName) {
  const names = wb.SheetNames;
  if (!names.includes('KB'))   { alert('"KB" 시트를 찾을 수 없습니다.'); return; }
  if (!names.includes('IIMS')) { alert('"IIMS" 시트를 찾을 수 없습니다.'); return; }

  // ── KB 파싱 ──
  const kbAoa = XLSX.utils.sheet_to_json(wb.Sheets['KB'], { header:1, defval:'' });
  const kbHdr = kbAoa[0].map(h => String(h||'').trim());
  const kbIdx = h => kbHdr.indexOf(h);
  const kbMap = {};
  for (let i = 1; i < kbAoa.length; i++) {
    const r = kbAoa[i];
    const 증번 = String(r[kbIdx('증권번호')]||'').trim();
    if (!증번) continue;
    kbMap[증번] = {
      증권번호:   증번,
      보험료:     cCleanNum(r[kbIdx('보험료')]),
      최종납입월: cToYYYYMM(r[kbIdx('최종납입월')]),
      입금일자:   cToDateStr(r[kbIdx('최종납입일')]),
      계약상태:   String(r[kbIdx('계약상태')]||'').trim(),
      납입방법:   String(r[kbIdx('납입방법')]||'').trim(),
    };
  }

  // ── IIMS 파싱 (FILTER 조건 적용) ──
  const iimsAoa = XLSX.utils.sheet_to_json(wb.Sheets['IIMS'], { header:1, defval:'' });
  const iimsHdr = iimsAoa[0].map(h => String(h||'').trim());
  const iiIdx   = h => iimsHdr.indexOf(h);
  const iimsMap = {};
  for (let i = 1; i < iimsAoa.length; i++) {
    const r   = iimsAoa[i];
    const 상태 = String(r[iiIdx('상태')]||'').trim();
    const 납방 = String(r[iiIdx('납방')]||'').trim();
    if (!IIMS_VALID_STATES.has(상태)) continue;
    if (납방 === IIMS_EXCL_납방) continue;
    const 증번 = String(r[iiIdx('증권번호')]||'').trim();
    if (!증번) continue;
    iimsMap[증번] = {
      증권번호: 증번,
      최종월도: cToYYYYMM(r[iiIdx('최종월도')]),
      회차:     cToInt(r[iiIdx('회차')]),
      상태,
      납방,
    };
  }

  // ── 정리 시트에서 메타 읽기 (A2=기준월도, F2=수금마감일) ──
  let 기준월도  = currentMonth.replace('-','');
  let 수금마감일 = null;
  if (names.includes('정리')) {
    const ws = wb.Sheets['정리'];
    const a2 = ws['A2']?.v;
    if (a2) { const s = String(a2).replace(/\D/g,'').slice(0,6); if (s.length===6) 기준월도=s; }
    const f2 = ws['F2']?.v;
    if (f2) { const s = String(f2).replace(/\D/g,''); if (s.length===8) 수금마감일=s; }
  }

  const meta   = { 기준월도, 수금마감일, 파일명: fileName };
  const counts = { kb: Object.keys(kbMap).length, iims: Object.keys(iimsMap).length };
  cCalcAndSave(kbMap, iimsMap, meta, counts);
}

// ── 계산 + 저장 (원천 데이터는 버림) ────────────
function cCalcAndSave(kbMap, iimsMap, meta, counts) {
  const 수금마감일 = meta.수금마감일;
  const isMalil   = !!수금마감일;
  const upload=[], manual=[], excluded=[], skipped=[];

  // 말일자: 마감일 당일 동일증번 건수
  const deadlineHits = {};
  if (isMalil) {
    Object.values(kbMap).forEach(kb => {
      if (String(kb.입금일자) === 수금마감일)
        deadlineHits[kb.증권번호] = (deadlineHits[kb.증권번호]||0) + 1;
    });
  }

  // IIMS 기준 순회
  Object.values(iimsMap).forEach(iims => {
    const 증번 = iims.증권번호;
    const kb   = kbMap[증번];

    if (!kb) {
      manual.push({ 보험사코드: KB_보험사코드, 증권번호: 증번,
        KB최종납입월: '', IIMS최종월도: iims.최종월도, 입금일자: '',
        계약상태: '', 월도차이: '', _확인사유: 'KB 데이터 없음' });
      return;
    }

    const 납면제  = 납입면제류.has(iims.상태);
    const 월도차이 = 납면제 ? 0 : cMonthDiff(kb.최종납입월, iims.최종월도);

    // 납입 주기: KB 납입방법 우선, 없으면 IIMS 납방
    const 주기 = cPayPeriod(kb.납입방법 || iims.납방);

    const baseRow = {
      보험사코드:   KB_보험사코드,
      증권번호:     증번,
      보험료:       kb.보험료,
      납입방법:     kb.납입방법,
      KB최종납입월: kb.최종납입월,
      IIMS최종월도: iims.최종월도,
      입금일자:     kb.입금일자,
      계약상태:     kb.계약상태,
      월도차이,
    };

    if (월도차이 < 0) {
      manual.push({ ...baseRow, _확인사유: `역전: 월도차이 ${월도차이}` });
      return;
    }
    if (월도차이 === 0) {
      skipped.push(baseRow);
      return;
    }

    // 주기 배수 체크: 3개월납이면 월도차이가 3·6·9... 여야 함
    if (월도차이 % 주기 !== 0) {
      manual.push({ ...baseRow, _확인사유: `주기 불일치: ${주기}개월납, 월도차이 ${월도차이}` });
      return;
    }

    // 월도차이 > 0 + 주기 배수 → 월도차이/주기 횟수만큼 행 생성
    // 예: 월납 월도차이=2 → 2행 / 3개월납 월도차이=3 → 1행 / 3개월납 월도차이=6 → 2행
    const 횟수 = 월도차이 / 주기;
    const iims_ym = iims.최종월도;  // IIMS 최종월도 기준으로 +1, +2... 쌓기

    if (isMalil) {
      const d = String(kb.입금일자);
      if (d > 수금마감일) {
        // 마감일 초과 → 전체 횟수 제외
        for (let i = 1; i <= 횟수; i++) {
          excluded.push({
            보험사코드:  KB_보험사코드,
            증권번호:    증번,
            보험료:      kb.보험료,
            최종납입월:  cAddMonth(iims_ym, 주기 * i),
            입금일자:    kb.입금일자,
            _제외사유:   `마감일(${수금마감일}) 초과`,
          });
        }
        return;
      }
      if (d === 수금마감일 && (deadlineHits[증번]||0) >= 2)
        manual.push({ ...baseRow, _확인사유: `마감일 당일 복수회차(${deadlineHits[증번]}건) — 전산확인 필요` });
    }

    for (let i = 1; i <= 횟수; i++) {
      upload.push({
        보험사코드:  KB_보험사코드,
        증권번호:    증번,
        보험료:      kb.보험료,
        최종납입월:  cAddMonth(iims_ym, 주기 * i),
        입금일자:    kb.입금일자,
      });
    }
  });

  _cUpload = upload; _cManual = manual; _cExcluded = excluded; _cSkipped = skipped;
  _cMeta = {
    type:      isMalil ? '말일자' : '일반',
    수금마감일, 기준월도: meta.기준월도,
    파일명:    meta.파일명||'', counts,
  };

  // 결과만 저장 (원천 데이터 제외 → 용량 초과 방지)
  const d = getData();
  if (!d[currentMonth]) d[currentMonth]={};
  const sess = d[currentMonth]['continue']?.sessions||[];
  d[currentMonth]['continue'] = {
    results: { upload, manual, excluded, skipped },
    meta: _cMeta, sessions: sess,
  };
  saveData(d);
  renderPage(currentPage);
}

// ── 결과 보기 (저장된 결과 재표시) ──────────────
function cRun() {
  const stored = (getData()[currentMonth]||{})['continue']||{};
  if (!stored.results) { alert('데이터가 없습니다.'); return; }
  _cUpload = stored.results.upload; _cManual = stored.results.manual;
  _cExcluded = stored.results.excluded; _cSkipped = stored.results.skipped;
  _cMeta = stored.meta || {};
  cRenderResult();
}

function cShowTab(id) {
  document.querySelectorAll('[id^="ctb-"]').forEach(b=>{b.style.background='#fff';b.style.color=b.style.borderColor;});
  const ab = document.getElementById('ctb-'+id);
  if (ab) { ab.style.background=ab.style.borderColor; ab.style.color='#fff'; }
  const data = {upload:_cUpload, manual:_cManual, excluded:_cExcluded, skipped:_cSkipped}[id];
  const tbl  = document.getElementById('c-tbl');
  if (!data?.length) { tbl.innerHTML=`<div class="empty-state"><i class="ti ti-check"></i><p>해당 건 없음</p></div>`; return; }
  const cols = Object.keys(data[0]).filter(c=>!c.startsWith('_'));
  tbl.innerHTML = `
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${data.slice(0,500).map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(String(r[c]??''))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="row-count">총 ${data.length.toLocaleString()}건${data.length>500?' (500건까지 표시)':''}</p>`;

function cExport(type) {
  const data = {upload:_cUpload, manual:_cManual, excluded:_cExcluded, skipped:_cSkipped}[type];
  if (!data?.length) { alert('데이터가 없습니다.'); return; }
  const dt  = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const base = `KB_계속분_${_cMeta.type}_${_cMeta.기준월도}_${dt}`;

  if (type === 'upload') {
    // ── 업로드 대상: 탭 구분 텍스트 (.txt) ──────────────
    // 포맷: 보험사코드\t증권번호\t보험료\t최종납입월\t입금일자 (헤더 없음)
    const UPLOAD_COLS = ['보험사코드','증권번호','보험료','최종납입월','입금일자'];
    const lines = data.map(r => UPLOAD_COLS.map(c => String(r[c]??'')).join('\t'));
    const blob  = new Blob([lines.join('\n')], { type:'text/plain;charset=utf-8;' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a'); a.href=url;
    a.download  = `${base}_업로드대상.txt`;
    a.click(); URL.revokeObjectURL(url);

  } else {
    // ── 수기확인 / 제외건 / 스킵: Excel (.xlsx) ─────────
    const cols = Object.keys(data[0]).filter(c => !c.startsWith('_'));
    // 사유 컬럼은 별도로 마지막에 추가
    const extraCols = Object.keys(data[0]).filter(c => c.startsWith('_'));
    const allCols = [...cols, ...extraCols.map(c => c.replace(/^_/, ''))];

    const wsData = [
      allCols,  // 헤더
      ...data.map(r => [
        ...cols.map(c => r[c]??''),
        ...extraCols.map(c => r[c]??''),
      ])
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    const tag = {manual:'수기확인', excluded:'제외건', skipped:'스킵'}[type];
    XLSX.utils.book_append_sheet(wb, ws, tag);
    XLSX.writeFile(wb, `${base}_${tag}.xlsx`);
  }
}

function cSaveSession() {
  if (!_cUpload) { alert('먼저 결과를 확인하세요.'); return; }
  const d = getData();
  if (!d[currentMonth]) d[currentMonth]={};
  if (!d[currentMonth]['continue']) d[currentMonth]['continue']={};
  const sess = d[currentMonth]['continue'].sessions||[];
  const { type, 수금마감일, 기준월도 } = _cMeta;
  sess.unshift({
    type,
    label: type==='말일자' ? `마감 ${수금마감일} · ${기준월도}` : 기준월도,
    upload:   _cUpload?.length||0,
    manual:   _cManual?.length||0,
    excluded: _cExcluded?.length||0,
    skipped:  _cSkipped?.length||0,
    ts: new Date().toLocaleString('ko-KR'),
  });
  d[currentMonth]['continue'].sessions = sess.slice(0,20);
  saveData(d);
  alert('이력이 저장되었습니다.');
  renderPage(currentPage);
}

function cClearSessions() {
  if (!confirm('작업이력을 모두 삭제하시겠습니까?')) return;
  const d = getData();
  if (d[currentMonth]?.['continue']) { d[currentMonth]['continue'].sessions=[]; saveData(d); }
  renderPage(currentPage);
}

function cReset() {
  if (!confirm('데이터를 초기화하시겠습니까?')) return;
  const d = getData();
  const sess = d[currentMonth]?.['continue']?.sessions||[];
  if (d[currentMonth]) d[currentMonth]['continue'] = { sessions: sess };
  saveData(d);
  renderPage(currentPage);
}

// ── 유틸 ──────────────────────────────────────
function cToYYYYMM(v) {
  if (!v && v!==0) return '';
  if (v instanceof Date) return `${v.getFullYear()}${String(v.getMonth()+1).padStart(2,'0')}`;
  const s = String(v).replace(/\D/g,'');
  if (s.length===6) return s;
  if (s.length>=8)  return s.slice(0,6);
  if (!isNaN(Number(v)) && Number(v)>40000) {
    const d = new Date(Math.round((Number(v)-25569)*86400*1000));
    return `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  }
  return s;
}

function cToDateStr(v) {
  if (!v && v!==0) return '';
  if (v instanceof Date) return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('');
  const s = String(v).replace(/\D/g,'');
  if (s.length===8) return s;
  if (!isNaN(Number(v)) && Number(v)>40000) {
    const d = new Date(Math.round((Number(v)-25569)*86400*1000));
    return [d.getUTCFullYear(),String(d.getUTCMonth()+1).padStart(2,'0'),String(d.getUTCDate()).padStart(2,'0')].join('');
  }
  return s;
}

function cCleanNum(v) {
  if (!v && v!==0) return '';
  return String(v).replace(/,/g,'').trim();
}

function cToInt(v) {
  if (!v && v!==0) return 0;
  const n = parseInt(String(v).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}

function cMonthDiff(a, b) {
  if (!a||!b) return 0;
  const ay=parseInt(String(a).slice(0,4)), am=parseInt(String(a).slice(4,6));
  const by=parseInt(String(b).slice(0,4)), bm=parseInt(String(b).slice(4,6));
  if (isNaN(ay)||isNaN(am)||isNaN(by)||isNaN(bm)) return 0;
  return (ay-by)*12+(am-bm);
}

// YYYYMM에 N개월 더하기
function cAddMonth(yyyymm, n) {
  const s = String(yyyymm).replace(/\D/g,'').slice(0,6);
  if (s.length < 6) return yyyymm;
  let y = parseInt(s.slice(0,4)), m = parseInt(s.slice(4,6));
  m += n;
  while (m > 12) { y++; m -= 12; }
  while (m < 1)  { y--; m += 12; }
  return String(y) + String(m).padStart(2,'0');
}

// 납입방법 문자열 → 주기(개월) 변환
// KB: 1개월납/3개월납/6개월납/연납  IIMS: 월납/3월납/연납
function cPayPeriod(납방) {
  const s = String(납방||'');
  if (s.includes('연납') || s.includes('12')) return 12;
  if (s.includes('6'))  return 6;
  if (s.includes('3'))  return 3;
  return 1;  // 월납/1개월납 기본
}
